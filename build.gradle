plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// 高德 Key：优先环境变量 AMAP_API_KEY，其次 flutter/android/local.properties 的 amap.api.key；
// 通过 BuildConfig 在运行时设置，不依赖宿主 app 的 manifestPlaceholders
def amapApiKey = System.getenv('AMAP_API_KEY')
if (amapApiKey == null || amapApiKey.trim().isEmpty()) {
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withReader('UTF-8') { localProps.load(it) }
    }
    amapApiKey = localProps.getProperty('amap.api.key', '')
}
// 不以明文进 APK：每次构建随机生成 key，按字节 XOR 后连同 key 以 hex 写入 BuildConfig。
// 只防 strings/jadx 一眼看到明文，不是真正的加密。
def amapApiKeyBytes = amapApiKey.trim().getBytes('UTF-8')
def amapApiKeyXor = new byte[amapApiKeyBytes.length]
new java.security.SecureRandom().nextBytes(amapApiKeyXor)
def amapApiKeyCipher = new byte[amapApiKeyBytes.length]
for (int i = 0; i < amapApiKeyBytes.length; i++) {
    amapApiKeyCipher[i] = (byte) (amapApiKeyBytes[i] ^ amapApiKeyXor[i])
}
def amapApiKeyCipherHex = amapApiKeyCipher.encodeHex().toString()
def amapApiKeyXorHex = amapApiKeyXor.encodeHex().toString()

android {
    namespace 'youyou.monitor.amap'
    compileSdk 34

    defaultConfig {
        minSdk 22
        buildConfigField "String", "AMAP_API_KEY_CIPHER", "\"${amapApiKeyCipherHex}\""
        buildConfigField "String", "AMAP_API_KEY_XOR", "\"${amapApiKeyXorHex}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.21"

    // 高德定位 SDK（用于轨迹点采集）
    implementation 'com.amap.api:location:6.4.5'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation project(':monitor-logger')
}
